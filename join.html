<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioX App - Join</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #7B1FA2;
            margin-bottom: 5px;
        }
        #pin-display {
            font-size: 36px;
            font-weight: bold;
            color: #7B1FA2;
            letter-spacing: 3px;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #7B1FA2;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #4a148c;
        }
        .note {
            margin-top: 30px;
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BioX</h1>
        <p>আপনার পিন নম্বর:</p>
        <div id="pin-display">খোঁজা হচ্ছে...</div>
        <a id="app-link" href="#" class="btn">BioX অ্যাপ খুলুন</a>
        <p class="note">অ্যাপ না থাকলে BioX ইনস্টল করে পিন-টা হাতে লিখুন।</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pin = urlParams.get('pin');

        if (pin) {
            document.getElementById('pin-display').innerText = pin;
            document.getElementById('app-link').href = "biox://join?pin=" + pin;
        } else {
            document.getElementById('pin-display').innerText = "পিন পাওয়া যায়নি";
            document.getElementById('app-link').style.display = "none";
        }
    </script>
</body>
</html>
